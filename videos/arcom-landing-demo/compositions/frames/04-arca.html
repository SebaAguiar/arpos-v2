         ============================================================ */

      /* kicker + its hairline, then the ✱ spike emphasis beat (frame.md spike-mark) */
      tl.fromTo(".a04-kicker", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" }, 0.12);
      tl.fromTo(".a04-kicker-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, 0.2);
      tl.fromTo(".a04-spike", { scale: 0.92 }, { scale: 1, duration: 0.3, ease: "power3.out" }, 0.34);

      /* trigger card arrives and settles (hero on screen by t = 0.48) */
      tl.fromTo(".a04-trigger-plate", { scale: 0.94, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.42, ease: "power3.out" }, 0.1);
      tl.fromTo(".a04-trigger-card", { scale: 0.94, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.38, ease: "power3.out" }, 0.1);
      tl.fromTo(".a04-trigger-eyebrow", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.34, ease: "power3.out" }, 0.18);
      tl.fromTo(".a04-trigger-amount", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.24);
      tl.fromTo(".a04-trigger-caption", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.32, ease: "power3.out" }, 0.32);
      tl.fromTo(".a04-trigger-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.44, ease: "power3.out" }, 0.36);
      tl.fromTo(".a04-pill", { scale: 0.9, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.24, ease: "power3.out" }, 0.38);
      tl.fromTo(".a04-ghost", { scale: 0.94, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.32, ease: "power3.out" }, 0.44);

      /* the one igniting click: cursor in -> press -> release, then the cursor leaves */
      tl.fromTo(".a04-cursor", { x: 96, y: 128, opacity: 0 }, { x: 0, y: 0, opacity: 1, duration: 0.32, ease: "power3.out" }, 0.3);

      /* press-release-spring: linear compression, spring recovery, hairline burst behind the pill */
      var REST_SHADOW = "0 1px 3px rgba(31,26,23,0.08), 0 4px 16px rgba(31,26,23,0.04)";
      var DOWN_SHADOW = "0 1px 2px rgba(31,26,23,0.05)";
      tl.to(".a04-pill", { scale: 0.93, boxShadow: DOWN_SHADOW, duration: 0.14, ease: "power1.in" }, 0.62);
      tl.to(".a04-cursor", { scale: 0.82, duration: 0.09, ease: "power1.in" }, 0.62);
      tl.to(".a04-pill", { scale: 1, boxShadow: REST_SHADOW, duration: 0.5, ease: "back.out(1.7)" }, 0.76);
      tl.to(".a04-cursor", { scale: 1, duration: 0.24, ease: "back.out(1.8)" }, 0.71);
      tl.fromTo(".a04-burst", { scale: 1, opacity: 0 }, { scale: 2.2, opacity: 0.55, duration: 0.24, ease: "power2.out" }, 0.76);
      tl.to(".a04-burst", { opacity: 0, duration: 0.34, ease: "power2.in" }, 1.0);

      /* cursor exits — the UI performs itself from here */
      tl.to(".a04-cursor", { x: -54, y: -86, opacity: 0, duration: 0.3, ease: "power2.in" }, 0.84);

      /* the trigger hands the frame to the machine (within-shot dismissal, not a frame exit) */
      tl.to(".a04-trigger-plate", { scale: 0.86, opacity: 0, duration: 0.28, ease: "power2.in" }, 0.9);
      tl.to(".a04-trigger-card", { scale: 0.86, opacity: 0, y: -58, duration: 0.28, ease: "power2.in" }, 0.9);
      tl.to(".a04-trigger-eyebrow", { opacity: 0, duration: 0.18, ease: "power1.in" }, 0.9);
      tl.to(".a04-trigger-amount", { opacity: 0, duration: 0.18, ease: "power1.in" }, 0.9);
      tl.to(".a04-trigger-caption", { opacity: 0, duration: 0.18, ease: "power1.in" }, 0.9);
      tl.to(".a04-trigger-rule", { opacity: 0, duration: 0.18, ease: "power1.in" }, 0.9);
      tl.to(".a04-pill", { opacity: 0, duration: 0.18, ease: "power1.in" }, 0.9);
      tl.to(".a04-ghost", { opacity: 0, duration: 0.18, ease: "power1.in" }, 0.9);

      /* ============================================================
         SCENE 2 — WORKING STATE (1.00 – 2.80s)
         Loader lockup: coral arc spinner + status couplet cycling in
         place + pulsing dots. One shared rotation proxy so the small
         docked spinner keeps the large one's phase.
         ============================================================ */
      tl.fromTo(".a04-ring-outer", { scale: 0.9, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 1.02);
      tl.fromTo(".a04-ring-dash", { scale: 0.9, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 1.02);
      tl.fromTo(".a04-spinner", { scale: 0.86, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.44, ease: "power3.out" }, 1.05);
      tl.fromTo(".a04-lockup-status", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.38, ease: "power3.out" }, 1.06);
      tl.fromTo(".a04-dots", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.34, ease: "power3.out" }, 1.12);
      tl.fromTo(".a04-lockup-note", { opacity: 0 }, { opacity: 1, duration: 0.44, ease: "power1.out" }, 1.16);

      /* svg-icon-enrichment · rotation through explicit centres via the SVG transform attribute */
      var spinA = one(".a04-spin-a");
      var spinB = one(".a04-spin-b");
      var spinDash = one(".a04-ring-dash circle");
      var dockSpin = one(".a04-dock-spin");
      var rot = { deg: 0 };
      if (spinA) spinA.setAttribute("transform", "rotate(0 64 64)");
      if (spinB) spinB.setAttribute("transform", "rotate(0 64 64)");
      if (spinDash) spinDash.setAttribute("transform", "rotate(0 100 100)");
      if (dockSpin) dockSpin.setAttribute("transform", "rotate(0 16 16)");
      tl.to(rot, {
        deg: 360 * 3.4,
        duration: 3.65,
        ease: "none",
        onUpdate: function () {
          var a = rot.deg;
          if (spinA) spinA.setAttribute("transform", "rotate(" + a + " 64 64)");
          if (spinB) spinB.setAttribute("transform", "rotate(" + (a * 1.45) + " 64 64)");
          if (spinDash) spinDash.setAttribute("transform", "rotate(" + (-a * 0.28) + " 100 100)");
          if (dockSpin) dockSpin.setAttribute("transform", "rotate(" + a + " 16 16)");
        }
      }, 1.05);

      /* discrete-text-sequence · in-place status couplet (instant swaps, no smear) */
      var STATUS_SEQ = [
        { t: 1.08, text: "Conectando…" },
        { t: 1.7, text: "Solicitando CAE…" },
        { t: 2.26, text: "Emitiendo…" }
      ];
      var CAE_TICKET_SEQ = [
        { t: 3.58, text: "········" },
        { t: 4.6, text: "73654879" }
      ];
      var CAE_LOG_SEQ = [
        { t: 3.6, text: "········" },
        { t: 4.6, text: "73654879" }
      ];
      var DOCK_SEQ = [
        { t: 2.86, text: "Timbrando" },
        { t: 4.68, text: "Timbrado" }
      ];

      function textAt(seq, time) {
        for (var i = seq.length - 1; i >= 0; i--) {
          if (time >= seq[i].t) return seq[i].text;
        }
        return "";
      }
      function seqDriver(sel, seq) {
        var el = one(sel);
        if (!el) return;
        el.textContent = seq[0].text;
        var last = seq[0].text;
        var driver = { t: 0 };
        tl.to(driver, {
          t: T,
          duration: T,
          ease: "none",
          onUpdate: function () {
            var next = textAt(seq, driver.t);
            if (next !== last) { /* swap only on a transition — per-frame writes flicker */
              el.textContent = next;
              last = next;
            }
          }
        }, 0);
      }
      seqDriver(".a04-lockup-status", STATUS_SEQ);
      seqDriver(".a04-cae-ticket", CAE_TICKET_SEQ);
      seqDriver(".a04-cae-log", CAE_LOG_SEQ);
      seqDriver(".a04-dock-word", DOCK_SEQ);

      /* sine-wave-loop · phase-offset loading dots, finite, dead before the payload lands */
      var dotEls = q(".a04-dot");
      var pulse = { p: 0 };
      tl.to(pulse, {
        p: Math.PI * 2 * 1.6,
        duration: 1.62,
        ease: "none",
        onUpdate: function () {
          for (var i = 0; i < dotEls.length; i++) {
            var s = 1 + Math.sin(pulse.p + i * 0.9) * 0.2;
            dotEls[i].style.transform = "scale(" + s.toFixed(4) + ")";
          }
        }
      }, 1.1);
      tl.to(".a04-dots", { opacity: 0, duration: 0.24, ease: "power1.in" }, 2.62);

      /* the scan label shrinks and docks to the right column; the canvas now belongs to
         what it produces. The small docked header carries readable type at its own size. */
      tl.fromTo(".a04-dock-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 2.86);
      tl.fromTo(".a04-dock", { scale: 0.82, opacity: 0, y: -10 }, { scale: 1, opacity: 1, y: 0, duration: 0.42, ease: "power3.out" }, 2.86);
      tl.fromTo(".a04-dock-spike", { scale: 0.92 }, { scale: 1, duration: 0.3, ease: "power3.out" }, 2.94);
      tl.fromTo(".a04-dock-spinner", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.34, ease: "power3.out" }, 2.9);
      tl.to(".a04-lockup", { scale: 0.5, opacity: 0, duration: 0.3, ease: "power2.in" }, 2.62);

      /* ============================================================
         SCENE 3 — THE RECEIPT CASCADES IN (2.80 – 4.60s)
         spring-pop-entrance for the card, dynamic-content-sequencing
         stagger for its rows, svg-path-draw for the QR.
         ============================================================ */
      tl.fromTo(".a04-ticket-plate", { scale: 0.965, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.46, ease: "power3.out" }, 3.0);
      tl.fromTo(".a04-ticket-face", { scale: 0.965, opacity: 0, y: 26 }, { scale: 1, opacity: 1, y: 0, duration: 0.46, ease: "power3.out" }, 3.0);
      tl.fromTo(".a04-ticket-title", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.34, ease: "power3.out" }, 3.04);
      tl.fromTo(".a04-ticket-sub", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 3.1);
      tl.fromTo(".a04-ticket-subrule", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.out" }, 3.14);

      var rows = q(".a04-row");
      for (var r = 0; r < rows.length; r++) {
        tl.fromTo(rows[r], { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.36, ease: "power3.out" }, 3.16 + r * 0.14);
      }
      tl.fromTo(".a04-ticket-footrule", { scaleX: 0 }, { scaleX: 1, duration: 0.36, ease: "power2.out" }, 3.9);

      /* QR builds itself: frame traces, finder patterns trace, module rows cascade in */
      var QR_PATTERN = ["1101101", "1010110", "0111011", "1100101", "0011110", "1011011", "0101100"];
      var qrSvg = one(".a04-qr svg");
      var MOD = 6;
      var PITCH = 7;
      var ORIGIN = 34;
      for (var row = 0; row < QR_PATTERN.length; row++) {
        var d = "";
        for (var col = 0; col < QR_PATTERN[row].length; col++) {
          if (QR_PATTERN[row].charAt(col) === "1") {
            var x = ORIGIN + col * PITCH;
            var y = ORIGIN + row * PITCH;
            d += "M " + x + " " + y + " h " + MOD + " v " + MOD + " h " + -MOD + " Z ";
          }
        }
        if (!d) continue;
        var p = document.createElementNS("http://www.w3.org/2000/svg", "path");
        p.setAttribute("d", d);
        p.setAttribute("class", "a04-qr-mod");
        qrSvg.appendChild(p);
        tl.fromTo(p, { fillOpacity: 0 }, { fillOpacity: 1, duration: 0.16, ease: "none" }, 4.0 + row * 0.045);
      }

      tl.fromTo(".a04-qr", { scale: 0.9, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.34, ease: "power3.out" }, 3.84);
      var qFrame = one(".a04-qr-frame");
      var finders = q(".a04-qr-finder");
      var eyes = q(".a04-qr-eye");
      var dashed = (qFrame ? [qFrame] : []).concat(Array.prototype.slice.call(finders));
      for (var fp = 0; fp < dashed.length; fp++) {
        var pathEl = dashed[fp];
        if (!pathEl) continue;
        var len = pathEl.getTotalLength ? pathEl.getTotalLength() : 100;
        pathEl.style.strokeDasharray = String(len);
        pathEl.style.strokeDashoffset = String(len);
        tl.to(pathEl, { strokeDashoffset: 0, duration: 0.2, ease: "power2.out" }, 3.92 + fp * 0.06);
      }
      for (var ep = 0; ep < eyes.length; ep++) {
        if (!eyes[ep]) continue;
        tl.fromTo(eyes[ep], { fillOpacity: 0 }, { fillOpacity: 1, duration: 0.16, ease: "power1.out" }, 4.02 + ep * 0.06);
      }
      tl.fromTo(".a04-qr-sweep", { y: 0, opacity: 0.9 }, { y: 128, duration: 0.5, ease: "none" }, 3.92);
      tl.to(".a04-qr-sweep", { opacity: 0, duration: 0.14, ease: "power1.in" }, 4.4);

      tl.fromTo(".a04-total-label", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 4.28);
      tl.fromTo(".a04-total-value", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.38, ease: "power3.out" }, 4.32);
      tl.fromTo(".a04-total-iva", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.32, ease: "power3.out" }, 4.44);

      /* the machine's own answer arrives alongside the document */
      tl.fromTo(".a04-log-bar", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.36, ease: "power3.out" }, 3.04);
      tl.fromTo(".a04-log-body", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 3.06);
      tl.fromTo(".a04-log-req", { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, 3.08);
      var logLines = q(".a04-log-line");
      for (var lp = 0; lp < logLines.length; lp++) {
        if (!logLines[lp]) continue;
        tl.fromTo(logLines[lp], { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.32, ease: "power3.out" }, 3.24 + lp * 0.18);
      }
      tl.fromTo(".a04-log-strip", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, 4.5);

      /* ============================================================
         SCENE 4 — STATE MUTATION (4.60 – 6.00s)
         scale-swap-transition on the badge (outline -> solid coral),
         svg-path-draw check, then a held read with bounded jitter.
         ============================================================ */
      tl.fromTo(".a04-chip-pending", { scale: 0.9, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.34, ease: "power3.out" }, 3.16);
      tl.to(".a04-chip-pending", { scale: 0.7, opacity: 0, duration: 0.3, ease: "power2.in" }, 4.6);
      tl.fromTo(".a04-chip-done", { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.44, ease: "power3.out" }, 4.74);

      var checkPath = one(".a04-chip-check path");
      if (checkPath) {
        var checkLen = checkPath.getTotalLength ? checkPath.getTotalLength() : 40;
        checkPath.style.strokeDasharray = String(checkLen);
        checkPath.style.strokeDashoffset = String(checkLen);
        tl.to(checkPath, { strokeDashoffset: 0, duration: 0.34, ease: "power2.out" }, 4.86);
      }

      /* the working pulse dies the instant the state resolves */
      tl.to(".a04-dock-spinner", { scale: 0, opacity: 0, duration: 0.22, ease: "power2.in" }, 4.66);

      /* hold: the certificate is legible, one bounded breath, settled before the crossfade */
      tl.to(".a04-ticket", { y: -2, duration: 0.42, ease: "sine.inOut", yoyo: true, repeat: 1 }, 5.1);
      tl.to(".a04-chip", { y: -1.6, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 5.2);
    })();
  </script>
</template>
