name: Release & Sign

on:
  push:
    tags:
      - 'v*'

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            bundle-name: linux
          - os: macos-latest
            target: darwin
            bundle-name: macos
          - os: windows-latest
            target: windows-x86_64
            bundle-name: windows

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      # ── Node.js + pnpm ──────────────────────────────
      - uses: pnpm/action-setup@v2
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      # ── Rust ─────────────────────────────────────────
      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/arpos-launcher/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/arpos-launcher/src-tauri/Cargo.lock') }}

      # ── Linux system deps (Tauri) ────────────────────
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libayatana-appindicator3-dev

      # ── Install JS deps ─────────────────────────────
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Generate Prisma client ──────────────────────
      - name: Generate Prisma client
        run: pnpm --filter api exec prisma generate

      # ── Build JS (API + Admin + POS) ────────────────
      - name: Build JS frontends
        run: |
          pnpm --filter api build
          pnpm --filter pos-react build

      # ── Build Tauri app ─────────────────────────────
      - name: Build Tauri app
        run: pnpm --filter arpos-launcher tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # ── Determine bundle path ───────────────────────
      - name: Locate bundles
        id: bundles
        run: |
          BUNDLE_DIR="apps/arpos-launcher/src-tauri/target/release/bundle"
          echo "bundle-dir=$BUNDLE_DIR" >> "$GITHUB_OUTPUT"

          case "${{ matrix.os }}" in
            ubuntu-latest)
              echo "pattern=$BUNDLE_DIR/**/*.{deb,rpm,AppImage}" >> "$GITHUB_OUTPUT"
              echo "manifest=$BUNDLE_DIR/deb/*.deb" >> "$GITHUB_OUTPUT"
              ;;
            macos-latest)
              echo "pattern=$BUNDLE_DIR/**/*.{dmg}" >> "$GITHUB_OUTPUT"
              echo "manifest=$BUNDLE_DIR/dmg/*.dmg" >> "$GITHUB_OUTPUT"
              ;;
            windows-latest)
              echo "pattern=$BUNDLE_DIR/**/*.{msi,exe}" >> "$GITHUB_OUTPUT"
              echo "manifest=$BUNDLE_DIR/msi/*.msi" >> "$GITHUB_OUTPUT"
              ;;
          esac

      # ── Generate updater manifest ───────────────────
      - name: Generate updater manifest
        id: manifest
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Find the signature file generated by Tauri during build
          SIG_FILE=$(ls apps/arpos-launcher/src-tauri/target/release/bundle/**/*.sig 2>/dev/null | head -1)

          if [ -n "$SIG_FILE" ]; then
            SIGNATURE=$(cat "$SIG_FILE")
          else
            SIGNATURE=""
          fi

          # Build the platform-specific updater JSON
          # Tauri v2 reads per-platform entries from the release body or a separate JSON
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "pub_date=$TIMESTAMP" >> "$GITHUB_OUTPUT"
          echo "signature=$SIGNATURE" >> "$GITHUB_OUTPUT"

      # ── Upload artifacts ────────────────────────────
      - name: Upload bundles as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.bundle-name }}
          path: ${{ steps.bundles.outputs.bundle-dir }}
          retention-days: 5

  # ── Create GitHub Release ───────────────────────────
  create-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all bundles
        uses: actions/download-artifact@v4
        with:
          pattern: bundles-*
          merge-multiple: true
          path: release-artifacts

      - name: List artifacts
        run: find release-artifacts -type f | sort

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: ArPOS ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: release-artifacts/**/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
