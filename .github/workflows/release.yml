name: Release & Sign

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundle-name: linux
          - os: macos-latest
            bundle-name: macos
          - os: windows-latest
            bundle-name: windows

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5

      # ── Node.js + pnpm ──────────────────────────────
      - uses: pnpm/action-setup@v2
        with:
          version: latest

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      # ── Rust ─────────────────────────────────────────
      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/arcon-launcher/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/arcon-launcher/src-tauri/Cargo.lock') }}

      # ── Linux system deps (Tauri) ────────────────────
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libayatana-appindicator3-dev

      # ── Install JS deps ─────────────────────────────
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Generate Prisma client ──────────────────────
      - name: Generate Prisma client
        run: pnpm --filter api exec prisma generate

      # ── Create env file for API build ───────────────
      - name: Create env file
        run: |
          echo 'DATABASE_URL="file:./dev.db"' > apps/api/.env
          echo 'PORT=3000' >> apps/api/.env
          echo 'JWT_SECRET="ci-secret"' >> apps/api/.env

      # ── Build signed Tauri bundles (deb/rpm/appimage
      #    on Linux, dmg on macOS, msi/nsis on Windows).
      #    The updater .sig files are generated here when
      #    TAURI_SIGNING_PRIVATE_KEY is set. ────────────
      - name: Build Tauri app (signed bundles)
        run: pnpm --filter arcon-launcher tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # ── Stage release artifacts ──────────────────────
      # Upload only the final installers + their .sig files.
      # Uploading the whole bundle dir would publish build
      # internals (AppImage AppDir, .deb/.rpm temp files)
      # and break the release upload.
      - name: Stage release artifacts
        run: |
          mkdir -p staging
          find apps/arcon-launcher/src-tauri/target/release/bundle -type f \( \
            -name "*.deb" -o \
            -name "*.rpm" -o \
            -name "*.AppImage" -o \
            -name "*.dmg" -o \
            -name "*.msi" -o \
            -name "*.exe" -o \
            -name "*.sig" \
          \) -exec cp {} staging/ \;

      - name: Upload bundles as artifacts
        uses: actions/upload-artifact@v6
        with:
          name: bundles-${{ matrix.bundle-name }}
          path: staging/
          retention-days: 5

  # ── Create GitHub Release ───────────────────────────
  create-release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Download all bundles
        uses: actions/download-artifact@v5
        with:
          pattern: bundles-*
          merge-multiple: true
          path: release-artifacts

      - name: List artifacts
        run: find release-artifacts -type f | sort

      - name: Verify updater signatures present
        run: |
          sigs=$(find release-artifacts -name "*.sig" | wc -l)
          if [ "$sigs" -eq 0 ]; then
            echo "::error::No .sig files found — updater artifacts were not generated (check createUpdaterArtifacts in tauri.conf.json)."
            exit 1
          fi
          echo "Found $sigs signature file(s)"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Arcon ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: release-artifacts/**/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
