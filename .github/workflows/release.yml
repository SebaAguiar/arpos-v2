name: Release & Sign

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundle-name: linux
          - os: macos-latest
            bundle-name: macos
          - os: windows-latest
            bundle-name: windows

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5

      # ── Node.js + pnpm ──────────────────────────────
      - uses: pnpm/action-setup@v2
        with:
          version: latest

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      # ── Rust ─────────────────────────────────────────
      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/arpos-launcher/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/arpos-launcher/src-tauri/Cargo.lock') }}

      # ── Linux system deps (Tauri) ────────────────────
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libayatana-appindicator3-dev

      # ── Install JS deps ─────────────────────────────
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Generate Prisma client ──────────────────────
      - name: Generate Prisma client
        run: pnpm --filter api exec prisma generate

      # ── Create env file for API build ───────────────
      - name: Create env file
        run: |
          echo 'DATABASE_URL="file:./dev.db"' > apps/api/.env
          echo 'PORT=3000' >> apps/api/.env
          echo 'JWT_SECRET="ci-secret"' >> apps/api/.env

      # ── Build signed Tauri bundles (deb/rpm/appimage
      #    on Linux, dmg on macOS, msi/nsis on Windows).
      #    The updater .sig files are generated here when
      #    TAURI_SIGNING_PRIVATE_KEY is set. ────────────
      - name: Build Tauri app (signed bundles)
        run: pnpm --filter arpos-launcher tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # ── Upload bundles ──────────────────────────────
      # Tauri only builds the bundle targets available on
      # each OS, so uploading the whole bundle dir keeps
      # the workflow OS-agnostic.
      - name: Upload bundles as artifacts
        uses: actions/upload-artifact@v6
        with:
          name: bundles-${{ matrix.bundle-name }}
          path: apps/arpos-launcher/src-tauri/target/release/bundle/
          retention-days: 5

  # ── Create GitHub Release ───────────────────────────
  create-release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Download all bundles
        uses: actions/download-artifact@v5
        with:
          pattern: bundles-*
          merge-multiple: true
          path: release-artifacts

      - name: List artifacts
        run: find release-artifacts -type f | sort

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: ArPOS ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: release-artifacts/**/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
