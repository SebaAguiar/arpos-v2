name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-api:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v2
        with:
          version: latest

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter api exec prisma generate

      - name: Create env file
        run: |
          echo 'DATABASE_URL="file:./dev.db"' > apps/api/.env
          echo 'PORT=3000' >> apps/api/.env
          echo 'JWT_SECRET="ci-secret"' >> apps/api/.env

      - name: Run migrations
        run: pnpm --filter api exec prisma migrate deploy

      - name: Run API tests
        run: pnpm --filter api test

  build-pos:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v2
        with:
          version: latest

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm --filter api build

      - name: Build POS
        run: pnpm --filter pos-react build
        env:
          VITE_LICENSE_PUBLIC_KEY: ${{ secrets.VITE_LICENSE_PUBLIC_KEY }}
          VITE_CLOUD_API_BASE: ${{ secrets.VITE_CLOUD_API_BASE }}

      # Guards against shipping a POS that throws on boot. Pull requests from
      # forks do not get repository secrets, so the build genuinely lacks the
      # key there; skip the check rather than fail every external PR.
      - name: Verify POS bundle configuration
        if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: node .github/scripts/verify-pos-bundle.mjs

      - name: Run POS tests
        run: pnpm --filter pos-react test

      - name: Verify chunk splitting
        run: |
          ls -la apps/pos-react/dist/assets/
          echo "---"
          echo "Main bundle should be < 300KB"
          MAIN_SIZE=$(du -k apps/pos-react/dist/assets/index-*.js | cut -f1)
          echo "Main chunk: ${MAIN_SIZE}KB"
          [ "$MAIN_SIZE" -lt 300 ] && echo "OK" || echo "WARNING: main bundle > 300KB"

  build-launcher:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v2
        with:
          version: latest

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/arcom-launcher/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/arcom-launcher/src-tauri/Cargo.lock') }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libayatana-appindicator3-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        run: |
          pnpm --filter api exec prisma generate
          echo 'DATABASE_URL="postgres://ci:ci@localhost:5432/ci"' > apps/admin-panel/.env
          pnpm --filter admin-panel exec prisma generate --schema ../../packages/prisma-schema/prisma/schema.prisma

      - name: Create env file
        run: |
          echo 'DATABASE_URL="file:./dev.db"' > apps/api/.env
          echo 'PORT=3000' >> apps/api/.env
          echo "JWT_SECRET=\"$(openssl rand -hex 32)\"" >> apps/api/.env

      # Compile-check the Tauri Rust sources. This job used to re-run the API
      # tests (already covered by the test-api job) and never compiled Rust,
      # so a broken launcher was only discovered inside release.yml, after the
      # three-OS matrix and the signing step. `cargo check` validates every
      # Rust source and the tauri build script without paying for full
      # release-profile codegen; release.yml still does the real build.
      - name: Compile-check Tauri Rust sources
        working-directory: apps/arcom-launcher/src-tauri
        run: cargo check --locked --all-targets

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v2
        with:
          version: latest

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        run: |
          pnpm --filter api exec prisma generate
          echo 'DATABASE_URL="postgres://ci:ci@localhost:5432/ci"' > apps/admin-panel/.env
          pnpm --filter admin-panel exec prisma generate --schema ../../packages/prisma-schema/prisma/schema.prisma

      - name: Create env file
        run: |
          echo 'DATABASE_URL="file:./dev.db"' > apps/api/.env
          echo 'PORT=3000' >> apps/api/.env
          echo 'JWT_SECRET="ci-secret"' >> apps/api/.env

      - name: ESLint (API, POS, admin-panel)
        run: pnpm lint

      - name: TypeScript check (API, POS, admin-panel)
        run: pnpm typecheck
