name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-api:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter api exec prisma generate

      - name: Create env file
        run: |
          echo 'DATABASE_URL="file:./dev.db"' > apps/api/.env
          echo 'PORT=3000' >> apps/api/.env
          echo 'JWT_SECRET="ci-secret"' >> apps/api/.env

      - name: Run migrations
        run: pnpm --filter api exec prisma migrate deploy

      - name: Run API tests
        run: pnpm --filter api test

  build-pos:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm --filter api build

      - name: Build POS
        run: pnpm --filter pos-react build

      - name: Verify chunk splitting
        run: |
          ls -la apps/pos-react/dist/assets/
          echo "---"
          echo "Main bundle should be < 300KB"
          MAIN_SIZE=$(du -k apps/pos-react/dist/assets/index-*.js | cut -f1)
          echo "Main chunk: ${MAIN_SIZE}KB"
          [ "$MAIN_SIZE" -lt 300 ] && echo "OK" || echo "WARNING: main bundle > 300KB"

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter api exec prisma generate

      - name: TypeScript check (API)
        run: pnpm --filter api exec tsc --noEmit

      - name: TypeScript check (POS)
        run: pnpm --filter pos-react exec tsc --noEmit
